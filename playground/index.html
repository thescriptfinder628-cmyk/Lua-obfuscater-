<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lua Obfuscator — playground</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent-dim: #238636;
    --danger: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input[type=number] {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  input[type=number] { width: 90px; }
  button {
    background: var(--accent-dim); color: #fff; border: 1px solid rgba(240,246,252,.1);
    border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2ea043; }
  button.secondary { background: #21262d; color: var(--text); }
  button.secondary:hover { background: #30363d; }
  button:disabled { opacity: .6; cursor: progress; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); flex: 1; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; background: var(--bg); min-height: 0; }
  .pane-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .pane-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; padding: 14px;
    background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px;
    line-height: 1.55; min-height: 46vh; tab-size: 2;
  }
  textarea::selection { background: #1f6feb55; }
  #out { color: #a5d6ff; white-space: pre; overflow: auto; }
  .status { padding: 8px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); font-family: var(--mono); }
  .status.err { color: var(--danger); white-space: pre-wrap; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; }
  .pill { border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; font-size: 11.5px; }
  .warn { color: #d29922; }
</style>
</head>
<body>
<header>
  <h1>Lua<span>Obfuscator</span></h1>
  <span class="tag">paste code, get unreadable code that still runs</span>
  <div class="controls">
    <label>level
      <select id="level">
        <option value="light">light</option>
        <option value="medium" selected>medium</option>
        <option value="heavy">heavy</option>
        <option value="insane">insane</option>
      </select>
    </label>
    <label>seed <input type="number" id="seed" value="7" min="0" step="1"></label>
    <label><input type="checkbox" id="verify"> verify by running it</label>
    <button id="run">Obfuscate</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="pane-head">Input
      <div class="right"><button class="secondary" id="sample">Load sample</button></div>
    </div>
    <textarea id="in" spellcheck="false" placeholder="-- paste Lua here"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head">Output
      <div class="right">
        <button class="secondary" id="copy">Copy</button>
        <button class="secondary" id="download">Download</button>
      </div>
    </div>
    <textarea id="out" readonly spellcheck="false" placeholder="-- result appears here"></textarea>
  </section>
</main>
<div class="status" id="status">Ready.</div>

<script>
const SAMPLE = `-- a tiny inventory system
local Inventory = {}
Inventory.__index = Inventory

function Inventory.new(capacity)
  return setmetatable({ items = {}, capacity = capacity }, Inventory)
end

function Inventory:add(name, count)
  if #self.items >= self.capacity then
    return false, "inventory full"
  end
  table.insert(self.items, { name = name, count = count or 1 })
  return true, "added " .. name
end

function Inventory:total()
  local sum = 0
  for _, item in ipairs(self.items) do
    sum = sum + item.count
  end
  return sum
end

local bag = Inventory.new(3)
print(bag:add("sword", 2))
print(bag:add("potion", 5))
print("total:", bag:total())
`;

const $ = (id) => document.getElementById(id);
const statusEl = $('status');

function setStatus(html, isError) {
  statusEl.className = 'status' + (isError ? ' err' : '');
  statusEl.innerHTML = html;
}

async function run() {
  const code = $('in').value;
  if (!code.trim()) { setStatus('Nothing to obfuscate.', true); return; }
  const button = $('run');
  button.disabled = true;
  setStatus('Working…');
  try {
    const response = await fetch('api/obfuscate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code,
        level: $('level').value,
        seed: Number($('seed').value),
        verify: $('verify').checked,
      }),
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      setStatus(data.error || ('HTTP ' + response.status), true);
      return;
    }
    $('out').value = data.code;
    const s = data.stats;
    const ratio = s.input_bytes ? (s.output_bytes / s.input_bytes) : 0;
    const parts = [
      `<span class="pill">${s.input_bytes}B → <b>${s.output_bytes}B</b> (${ratio.toFixed(2)}×)</span>`,
      `<span class="pill">seed <b>${s.seed}</b></span>`,
      `<span class="pill">${s.renamed} renamed</span>`,
    ];
    if (data.verified) parts.push('<span class="pill" style="color:var(--accent)">verified ✓</span>');
    if (data.warnings && data.warnings.length) {
      parts.push('<span class="warn">' + data.warnings.join('; ') + '</span>');
    }
    setStatus('<span class="stats">' + parts.join('') + '</span>');
  } catch (err) {
    setStatus('Request failed: ' + err, true);
  } finally {
    button.disabled = false;
  }
}

$('run').addEventListener('click', run);
$('sample').addEventListener('click', () => { $('in').value = SAMPLE; });
$('copy').addEventListener('click', async () => {
  if (!$('out').value) return;
  try {
    await navigator.clipboard.writeText($('out').value);
    setStatus('Copied to clipboard.');
  } catch { setStatus('Copy failed — select the text and press Ctrl/Cmd+C.', true); }
});
$('download').addEventListener('click', () => {
  if (!$('out').value) return;
  const blob = new Blob([$('out').value], { type: 'text/plain' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'obfuscated.lua';
  link.click();
  URL.revokeObjectURL(link.href);
});
$('in').addEventListener('keydown', (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); run(); }
  if (event.key === 'Tab') {
    event.preventDefault();
    const el = event.target;
    const start = el.selectionStart;
    el.value = el.value.slice(0, start) + '  ' + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = start + 2;
  }
});
$('in').value = SAMPLE;
</script>
</body>
</html>
