# Fly.io — free allowance covers this easily.
# Deploy: fly launch --no-deploy  (or fly deploy after `fly apps create`)
app = "forsakenis4-obfuscator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
